name: API Testing with Postman

on:
  push:
  pull_request:

jobs:
  api-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Start API
        run: |
          npm start > api.log 2>&1 &
          echo $! > api.pid
      - name: Wait for API
        run: |
          for i in {1..15}; do
            if curl -fsS http://127.0.0.1:3000/api/health; then exit 0; fi
            sleep 1
          done
          cat api.log
          exit 1
      - name: Run Postman/Newman tests
        run: npm run test:api
